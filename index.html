<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c1319">
  <title>LUNA CLUB</title>
  <link rel="stylesheet" href="css/game.css?v=luna1">
<link rel="stylesheet" href="finance.css?v=1"></head>
<body>
  <div id="app">
    <div id="background"></div>
    <div id="characterLayer" class="hidden"><img id="characterSprite" alt="character"></div>
    <div id="sceneModeFX"></div>
    <div id="rainLayer"></div>
    <div id="vignette"></div>

    <section id="titleScreen" class="screen active">
      <div class="titleShade"></div>
      <div class="titlePanel glass">
        <div class="eyebrow">LUNA CLUB</div>
        <h1>LUNA CLUB<br><small>月明かりのラウンジ</small></h1>
        <div class="subtitle">ルナと過ごす、特別なひととき。</div>
        <div class="menuGrid">
          <button id="newGameBtn" class="menu primary">はじめる</button>
          <button id="continueBtn" class="menu">つづきから</button>
          <button id="chapterBtn" class="menu">章選択</button>
          <button id="galleryBtn" class="menu">ギャラリー</button>
          <button id="endingsBtn" class="menu">エンディング</button>
          <button id="charactersBtn" class="menu">キャラクター</button>
          <button id="achievementsBtn" class="menu">実績</button>
          <button id="musicBtn" class="menu">音楽</button>
          <button id="routeBtn" class="menu">好感度</button>
          <button id="settingsBtnTitle" class="menu">設定</button>
        </div>
        <div id="progressLine" class="version">LUNA CLUB v1.0</div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div id="topbar">
        <div id="chapterMini"></div>
        <div class="topActions">
          <button id="autoBtn" class="chip">自動</button>
          <button id="skipBtn" class="chip">スキップ</button>
          <button id="rollbackBtn" class="chip">↶</button>
          <button id="historyBtn" class="chip">履歴</button>
          <button id="relationshipBtn" class="chip">好感度</button>
          <button id="saveBtn" class="chip">保存</button>
          <button id="loadBtn" class="chip">読込</button>
          <button id="settingsBtnGame" class="chip">設定</button>
          <button id="titleBtn" class="chip">タイトル</button>
        </div>
      </div>

      <div id="stats" class="glass compact fourHeartsStats" title="Route variables">
        <span>ルナ <b id="affectionValue">0</b></span>
        <span> <b id="suqingValue">0</b></span>
        <span> <b id="amyValue">0</b></span>
        <span> <b id="guningValue">0</b></span>
      </div>

      <div id="npcCard" class="npcCard glass hidden">
        <img id="npcPortrait" alt="">
        <div><div id="npcName" class="npcName"></div><div id="npcRole" class="npcRole"></div></div>
      </div>

      <div id="phoneCard" class="glass hidden">
        <div class="phoneHead">メッセージ</div>
        <div id="phoneFrom" class="phoneFrom"></div>
        <div id="phoneText" class="phoneText"></div>
      </div>

      <div id="chapterCard" class="overlayCard hidden">
        <div id="chapterNo" class="eyebrow"></div>
        <div id="chapterName" class="chapterName"></div>
      </div>

      <div id="cinematic" class="hidden">
        <div class="letterbox top"></div>
        <div class="letterbox bottom"></div>
        <div id="cinematicText"></div>
      </div>

      <div id="cgView" class="hidden">
        <img id="cgImage" alt="CG">
        <div id="cgCaption"></div>
        <div class="cgHint">クリックして進む</div>
      </div>

      <div id="endingCard" class="hidden">
        <div class="endingInner glass">
          <div class="eyebrow">ENDING</div>
          <div id="endingTitle" class="endingTitle"></div>
          <div id="endingSub" class="endingSub"></div>
          <div id="endingReason" class="endingReason hidden"></div>
          <div id="endingMeta" class="endingMeta"></div>
          <div class="endingActions">
            <button id="endingTitleBtn" class="menu primary">タイトルへ</button>
            <button id="endingReplayBtn" class="menu">選択肢に戻る</button>
          </div>
        </div>
      </div>

      <div id="dialogueWrap">
        <div id="dialogueBox" class="glass">
          <div id="speaker"></div>
          <div id="dialogue"></div>
          <div id="choices"></div>
          <div id="hint"></div>
        </div>
      </div>
    </section>

    <div id="modal" class="hidden">
      <div class="modalShade"></div>
      <div class="modalPanel glass">
        <div class="modalHead">
          <div id="modalTitle"></div>
          <button id="modalClose" class="iconBtn">×</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="flashLayer"></div>
    <div id="toast"></div>
  </div>
  <script src="js/engine.js?v=luna1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="finance.js?v=1"></script></body>
</html>
